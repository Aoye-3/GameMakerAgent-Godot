[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemaker-agent"
version = "0.1.0"
description = "Game-production context bridge for Codex, mature asset providers, and Godot MCPs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GameMakerAgent contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "Pillow>=11,<13",
]

[project.scripts]
gamemaker = "gamemaker_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamemaker_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
