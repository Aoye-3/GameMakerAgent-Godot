# Workspace-only trial connection. Does not modify the user's global MCP servers.
[mcp_servers.gamemaker_godot_trial]
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "F:/.GameMaker-Agent/scripts/start-godot-mcp.ps1"]
cwd = "F:/.GameMaker-Agent"
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 360
